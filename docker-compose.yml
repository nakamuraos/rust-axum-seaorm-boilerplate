services:
  server:
    container_name: server_container
    image: server:local
    build: .
    volumes:
      - ./.env:/app/.env
      - ./config:/app/config:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  # Background jobs, sharing the image and the configuration of the server.
  worker:
    container_name: server_worker_container
    image: server:local
    build: .
    entrypoint: ["./worker"]
    command: ["all", "--watch"]
    # The image health check probes the HTTP port, which the worker does not serve.
    healthcheck:
      disable: true
    volumes:
      - ./.env:/app/.env
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  db:
    container_name: server_db_container
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: example
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=password pg_isready -U postgres -d example"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

volumes:
  db_data:
    driver: local
