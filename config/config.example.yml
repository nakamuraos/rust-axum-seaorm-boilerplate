# Copy to config.yml (or point the CONFIG environment variable at a file)
# and adjust the values. Every key can be overridden by an environment
# variable named after its uppercased dotted path with `.` replaced by `_`
# (e.g. serve.port -> SERVE_PORT, database.url -> DATABASE_URL,
# swagger.basic_auth -> SWAGGER_BASIC_AUTH); APP_ENV overrides `env` and
# PORT is honored as an alias for SERVE_PORT.

env: development

serve:
  port: 8080

database:
  url: "postgres://postgres:password@db:5432/example"
  pool_max_size: 50
  timeout: 5
  run_migrations: true
  run_seeds: false

jwt:
  secret: change-me-to-a-secure-random-string-at-least-256-bits
  expiration_days: 7
  refresh_expiration_days: 30

workers:
  # Days a revoked refresh token is kept before the cleanup worker deletes it
  token_retention_days: 7
  # Default gap between two runs of a job started with --watch
  interval_hours: 24

bcrypt:
  cost: 12

swagger:
  endpoint: /docs
  # username:password, empty disables the basic auth protection
  basic_auth: ""

graphql:
  endpoint: /graphql
  basic_auth: ""

# Login with external providers. A provider is enabled once its credentials are
# set; each callback URL to register with the provider is
# {redirect_base_url}/api/v1/auth/oauth/{google|github|oidc}/callback
# (requires the `oauth2` / `oidc` Cargo features, enabled by default).
oauth:
  redirect_base_url: http://localhost:8080
  # Empty answers the callback with JSON; otherwise the browser is redirected to
  # this URL with `#token=...&refresh_token=...` appended.
  success_redirect_url: ""
  google:
    client_id: ""
    client_secret: ""
  github:
    client_id: ""
    client_secret: ""
  # Any OpenID Connect provider, e.g. https://keycloak.example.com/realms/main
  oidc:
    issuer: ""
    client_id: ""
    client_secret: ""
